<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>都nb</title>
<style>
:root{
  --bg:#fff3f6;
  --ink:#4a2b36;
  --muted:#9a6b7b;
  --card:#ffffff;
  --line:rgba(233,109,148,.28);
  --accent:#e9557f;
}

*{box-sizing:border-box;}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:
    radial-gradient(circle at 18% 12%, #ffe0ea 0%, transparent 46%),
    radial-gradient(circle at 82% 18%, #ffe9d6 0%, transparent 44%),
    radial-gradient(circle at 50% 100%, #e7f0ff 0%, transparent 52%),
    var(--bg);
  color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:clamp(18px,4vw,54px);
  gap:clamp(16px,3vw,32px);
}

/* ---------- 舞台 ---------- */
.stage{
  width:100%;
  max-width:1180px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  justify-items:center;
  gap:clamp(2px,.8vw,12px);
}

.person{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  width:100%;
  max-width:400px;
}

.frame{
  position:relative;
  width:100%;
  aspect-ratio:3 / 4;
  border-radius:22px;
  overflow:hidden;
  background:var(--card);
  border:3px solid #fff;
  box-shadow:0 16px 38px rgba(190,90,125,.22), 0 2px 6px rgba(190,90,125,.14);
  transition:transform .45s cubic-bezier(.2,.8,.3,1), box-shadow .45s ease;
}

.frame img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* 两张原图构图不同，各自对齐到脸部中心 */
.frame img[data-fit="boy1"]{ object-position:76% 22%; }
.frame img[data-fit="boy2"]{ object-position:42% 24%; }

.person:hover .frame{
  transform:translateY(-8px);
  box-shadow:0 26px 52px rgba(190,90,125,.3), 0 2px 6px rgba(190,90,125,.16);
}

.name{
  font-size:15px;
  letter-spacing:.16em;
  color:var(--muted);
  padding:5px 16px;
  background:rgba(255,255,255,.75);
  border:1px solid var(--line);
  border-radius:999px;
  white-space:nowrap;
}

/* 两人微微向中间倾身，形成「面对面」的动势 */
.person.left .frame{ transform-origin:right center; animation:leanLeft 5.5s ease-in-out infinite; }
.person.right .frame{ transform-origin:left center; animation:leanRight 5.5s ease-in-out infinite; }

@keyframes leanLeft{
  0%,100%{ transform:rotate(-2.4deg) translateY(0); }
  50%    { transform:rotate(-1deg)   translateY(-6px); }
}
@keyframes leanRight{
  0%,100%{ transform:rotate(2.4deg) translateY(0); }
  50%    { transform:rotate(1deg)    translateY(-6px); }
}

/* ---------- 中间的爱心 ---------- */
.heart-cell{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  padding:0 clamp(2px,1vw,14px);
}

.heart-wrap{
  position:relative;
  width:clamp(80px,12vw,168px);
  aspect-ratio:1;
  display:grid;
  place-items:center;
}

.heart-svg{
  width:100%;
  height:100%;
  overflow:visible;
  filter:drop-shadow(0 10px 20px rgba(233,85,127,.42));
  animation:beat 1.5s ease-in-out infinite;
}

@keyframes beat{
  0%,100%{ transform:scale(1); }
  14%    { transform:scale(1.14); }
  28%    { transform:scale(1); }
  42%    { transform:scale(1.09); }
  60%    { transform:scale(1); }
}

.heart-path{
  fill:url(#heartGrad);
}

/* 心跳扩散的光环 */
.pulse{
  position:absolute;
  inset:12%;
  border-radius:50%;
  border:2px solid rgba(233,85,127,.5);
  animation:pulse 2.4s ease-out infinite;
  pointer-events:none;
}
.pulse.d2{ animation-delay:1.2s; }

@keyframes pulse{
  0%  { transform:scale(.7); opacity:.75; }
  100%{ transform:scale(2.1); opacity:0; }
}

/* 从两侧飞向爱心的小心心 */
.spark{
  position:absolute;
  font-size:clamp(11px,1.2vw,17px);
  color:var(--accent);
  opacity:0;
  pointer-events:none;
  animation:fly 3.6s linear infinite;
}
.spark.s1{ left:-14%; top:34%; animation-delay:.2s; }
.spark.s2{ right:-14%; top:52%; animation-delay:1.4s; }
.spark.s3{ left:4%;  bottom:6%; animation-delay:2.5s; }

@keyframes fly{
  0%  { opacity:0; transform:translateX(var(--dx,0)) scale(.6); }
  18% { opacity:1; }
  70% { opacity:.9; }
  100%{ opacity:0; transform:translate(0,0) scale(1.15); }
}
.spark.s1{ --dx:-26px; }
.spark.s2{ --dx:26px; }
.spark.s3{ --dx:-16px; }

/* ---------- 文案 ---------- */
.caption{
  text-align:center;
  max-width:760px;
}

.caption h1{
  margin:0 0 10px;
  font-size:clamp(21px,3.2vw,34px);
  letter-spacing:.14em;
  font-weight:600;
  background:linear-gradient(96deg,#e9557f,#f08a5d 46%,#a86bd6);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.caption p{
  margin:0;
  font-size:clamp(12.5px,1.35vw,15px);
  line-height:1.9;
  color:var(--muted);
  letter-spacing:.06em;
}

.tools{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
}

button.tool{
  font:inherit;
  font-size:13.5px;
  letter-spacing:.1em;
  color:#b8455f;
  background:rgba(255,255,255,.85);
  border:1px solid var(--line);
  border-radius:999px;
  padding:9px 20px;
  cursor:pointer;
  transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
}

button.tool:hover{
  transform:translateY(-2px);
  background:#fff;
  box-shadow:0 10px 22px rgba(190,90,125,.2);
}

/* ---------- 窄屏：改为上下布局，爱心夹在两人之间 ---------- */
@media (max-width:720px){
  .stage{
    grid-template-columns:1fr;
    gap:10px;
  }
  .person{ max-width:min(72vw,280px); }
  .person.left .frame,
  .person.right .frame{ animation:none; }
  .person.left .frame{ transform:rotate(-1.6deg); }
  .person.right .frame{ transform:rotate(1.6deg); }
  .heart-wrap{ width:96px; margin:14px 0; }
  .pulse{ display:none; }
  .spark{ display:none; }
}

@media (prefers-reduced-motion:reduce){
  *{ animation:none !important; transition:none !important; }
}

/* 仅在截图/打印时冻结动画，方便核对静态排版 */
@media print{
  *{ animation:none !important; }
}
</style>
</head>
<body>

<main class="stage">

  <!-- 左边的人 -->
  <section class="person left" aria-label="左边的人">
    <div class="frame">
      <img src="images/boy1.png" alt="左边的人" data-fit="boy1">
    </div>
    <div class="name">左边的他</div>
  </section>

  <!-- 中间的爱心 -->
  <div class="heart-cell">
    <div class="heart-wrap" id="heartWrap" role="img" aria-label="一颗跳动的心">
      <span class="pulse"></span>
      <span class="pulse d2"></span>
      <span class="spark s1">♥</span>
      <span class="spark s2">♥</span>
      <span class="spark s3">♥</span>
      <svg class="heart-svg" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#ff8fb1"/>
            <stop offset="45%"  stop-color="#ef4d7c"/>
            <stop offset="100%" stop-color="#c62b62"/>
          </linearGradient>
        </defs>
        <path class="heart-path"
          d="M50 88.5
             C50 88.5 8 62.5 8 36.5
             C8 20.5 20.5 9 34.5 9
             C42.6 9 48 13.2 50 18.6
             C52 13.2 57.4 9 65.5 9
             C79.5 9 92 20.5 92 36.5
             C92 62.5 50 88.5 50 88.5 Z"/>
      </svg>
    </div>
  </div>

  <!-- 右边的人 -->
  <section class="person right" aria-label="右边的人">
    <div class="frame">
      <img src="images/boy2.png" alt="右边的人" data-fit="boy2">
    </div>
    <div class="name">右边的他</div>
  </section>

</main>

<div class="caption">
  <h1>面对面 · 一颗爱心</h1>
  <p>左边是痴呆，右边是享受，中间那颗心一直在跳。</p>
  <div class="tools">
    <button class="tool" id="btnBeat" type="button">让心跳快一点</button>
    <button class="tool" id="btnNote" type="button">点我一下</button>
  </div>
</div>

<script>
(function(){
  // 点击爱心：飘出一串小心心
  var wrap = document.getElementById('heartWrap');

  function burst(){
    for(var i = 0; i < 10; i++){
      (function(i){
        var s = document.createElement('span');
        s.textContent = '♥';
        s.style.position = 'absolute';
        s.style.left = '50%';
        s.style.top = '50%';
        s.style.fontSize = (12 + Math.random() * 14) + 'px';
        s.style.color = i % 2 ? '#ef4d7c' : '#ff9dbb';
        s.style.pointerEvents = 'none';
        s.style.transition = 'transform 1.1s cubic-bezier(.2,.8,.3,1), opacity 1.1s ease';
        wrap.appendChild(s);

        var ang = Math.random() * Math.PI * 2;
        var dist = 60 + Math.random() * 90;
        var dx = Math.cos(ang) * dist;
        var dy = Math.sin(ang) * dist - 30;

        requestAnimationFrame(function(){
          s.style.transform = 'translate(-50%,-50%) translate(' + dx + 'px,' + dy + 'px) scale(1.3) rotate(' + (Math.random()*120-60) + 'deg)';
          s.style.opacity = '0';
        });

        setTimeout(function(){ s.remove(); }, 1200);
      })(i);
    }
  }

  wrap.addEventListener('click', burst);
  wrap.style.cursor = 'pointer';

  // 让心跳快一点：加速 6 秒后恢复
  var btnBeat = document.getElementById('btnBeat');
  var svg = document.querySelector('.heart-svg');
  var fast = false;

  btnBeat.addEventListener('click', function(){
    fast = !fast;
    svg.style.animationDuration = fast ? '0.6s' : '1.5s';
    btnBeat.textContent = fast ? '恢复原来的心跳' : '让心跳快一点';
    burst();
  });

  // 点我一下
  var lines = [
    '左边那位：痴呆。',
    '右边那位：享受。',
    '中间那颗心：一直在跳。',
    '距离不是问题，爱心在中间就行。',
    '这一页会一直留在网上。'
  ];
  var idx = 0;
  document.getElementById('btnNote').addEventListener('click', function(){
    var p = document.querySelector('.caption p');
    p.textContent = lines[idx % lines.length];
    idx++;
    burst();
  });
})();
</script>

</body>
</html>
